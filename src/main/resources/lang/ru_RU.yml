# HardcoreLife messages - Русский
# Значения в {фигурных скобках} заменяются при отправке сообщения.
# Для отсутствующих ключей используется английское сообщение по умолчанию.
# Формат "жизней: {lives}" используется, чтобы не зависеть от склонения числа.

lives:
  server: "У сервера осталось жизней: {lives}."
  player: "У игрока {player} осталось жизней: {lives}."
  self: "У вас осталось жизней: {lives}."

setlives:
  changed_player: "Количество жизней игрока {player} изменено на {lives}"
  changed_self: "Ваше количество жизней изменено на: {lives}"
  changed_server: "Количество жизней сервера изменено на: {lives}"

death:
  server_remaining: "У сервера осталось жизней: {lives}."
  server_game_over: "Игра окончена! Когда будете готовы, используйте команду '/resetserver', чтобы начать заново."
  player_remaining: "У вас осталось жизней: {lives}."
  player_out_of_lives: "У игрока {player} закончились жизни."
  gained_life: "Вы получили дополнительную жизнь!"

join:
  server_remaining: "У сервера осталось жизней: {lives}."
  server_game_over: "О нет :c Игра окончена! Когда будете готовы, используйте команду '/resetserver', чтобы начать заново."
  welcome: "С возвращением на борт, {player}! У вас осталось жизней: {lives}."

life_scaling:
  lives_added: "Серверу добавлено жизней: {lives}!"

reset:
  kick: "Сервер сбрасывается. Пожалуйста, перезайдите."

error:
  unknown_player: "ОШИБКА: Неизвестный игрок '{player}'"
  player_and_value_required: "ОШИБКА: Необходимо указать игрока и значение."
