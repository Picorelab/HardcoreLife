# HardcoreLife messages - Français
# Les variables entre {accolades} sont remplacées lors de l'envoi du message.
# Les clés manquantes utilisent le message anglais par défaut.

lives:
  server: "Le serveur a {lives} vie(s) restante(s)."
  player: "{player} a {lives} vie(s) restante(s)."
  self: "Vous avez {lives} vie(s) restante(s)."

setlives:
  changed_player: "Le nombre de vies de {player} a été changé à {lives}"
  changed_self: "Votre nombre de vies a été changé à : {lives}"
  changed_server: "Le nombre de vies du serveur a été changé à : {lives}"

death:
  server_remaining: "Le serveur a {lives} vie(s) restante(s)."
  server_game_over: "Partie terminée ! Quand vous êtes prêts, utilisez la commande '/resetserver' pour recommencer."
  player_remaining: "Vous avez {lives} vie(s) restante(s)."
  player_out_of_lives: "{player} a épuisé toutes ses vies."
  gained_life: "Vous avez gagné une vie !"

join:
  server_remaining: "Le serveur a {lives} vie(s) restante(s)."
  server_game_over: "Oh non :c Partie terminée ! Quand vous êtes prêts, utilisez la commande '/resetserver' pour recommencer."
  welcome: "Bon retour à bord {player} ! Vous avez {lives} vie(s) restante(s)."

life_scaling:
  lives_added: "{lives} vie(s) ont été ajoutée(s) au serveur !"

reset:
  kick: "Le serveur est en cours de réinitialisation. Veuillez vous reconnecter."

error:
  unknown_player: "ERREUR : Joueur inconnu '{player}'"
  player_and_value_required: "ERREUR : Le joueur et la valeur doivent être spécifiés."
